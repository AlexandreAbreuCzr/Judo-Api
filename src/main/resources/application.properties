spring.application.name=Judo-Candoi-Api

# Banco (PostgreSQL em producao e H2 em fallback local)
spring.datasource.url=${DB_URL_JUDO:${DB_URL:jdbc:h2:mem:judo_candoi;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.password=${ADMIN_PASSWORD:1234}
app.whatsapp.number=${WHATSAPP_NUMBER:5546999999999}
app.instagram.handle=${INSTAGRAM_HANDLE:@judocandoi}
app.academy.address=${ACADEMY_ADDRESS:Avenida Central, 123 - Candoi/PR}
app.google.maps.embed=${GOOGLE_MAPS_EMBED:https://www.google.com/maps?q=Candoi%20PR&output=embed}
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size-bytes=${UPLOAD_MAX_SIZE_BYTES:15728640}
